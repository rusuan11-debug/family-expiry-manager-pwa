name: Deploy Family Expiry Manager PWA

on:
  push:
    branches: [main]
    paths:
      - "家庭保质期管家_PWA_V1.0_源码包.zip"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract PWA source package
        run: |
          test -f "家庭保质期管家_PWA_V1.0_源码包.zip"
          mkdir source
          unzip -q "家庭保质期管家_PWA_V1.0_源码包.zip" -d source
          test -f source/index.html
          test -f source/manifest.webmanifest
          test -f source/sw.js
          mkdir _site
          cp -a source/. _site/
          touch _site/.nojekyll

      - name: Run application tests
        working-directory: source
        run: |
          npm test --if-present
          node --check app.js
          node --check core.js
          node --check storage.js
          node --check sw.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
