name: Deploy Family Expiry Manager PWA

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'core.js'
      - 'storage.js'
      - 'styles.css'
      - 'sw.js'
      - 'ocr.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Assemble complete PWA
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          mkdir _site
          unzip -q "$ZIP_FILE" -d _site
          for file in index.html app.js core.js storage.js styles.css sw.js ocr.js; do
            test -s "$file"
            cp "$file" "_site/$file"
          done
          touch _site/.nojekyll
          test -f _site/manifest.webmanifest
          test -f _site/assets/icon-192.png

      - name: Run JavaScript syntax and logic tests
        working-directory: _site
        run: |
          npm test --if-present
          node --check app.js
          node --check core.js
          node --check storage.js
          node --check sw.js
          node --check ocr.js

      - name: Bundle local OCR engines and Chinese/English models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _vendor
          cd _vendor
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts tesseract.js@6 tesseract.js-core@6
          cd ..
          mkdir -p _site/ocr/core _site/ocr/lang
          cp _vendor/node_modules/tesseract.js/dist/tesseract.min.js _site/ocr/tesseract.min.js
          cp _vendor/node_modules/tesseract.js/dist/worker.min.js _site/ocr/worker.min.js
          cp _vendor/node_modules/tesseract.js-core/tesseract-core-lstm.wasm.js _site/ocr/core/
          cp _vendor/node_modules/tesseract.js-core/tesseract-core-lstm.wasm _site/ocr/core/
          cp _vendor/node_modules/tesseract.js-core/tesseract-core-simd-lstm.wasm.js _site/ocr/core/
          cp _vendor/node_modules/tesseract.js-core/tesseract-core-simd-lstm.wasm _site/ocr/core/
          curl -fsSL --retry 3 https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/chi_sim.traineddata | gzip -9n > _site/ocr/lang/chi_sim.traineddata.gz
          curl -fsSL --retry 3 https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata | gzip -9n > _site/ocr/lang/eng.traineddata.gz
          test -s _site/ocr/tesseract.min.js
          test -s _site/ocr/worker.min.js
          test -s _site/ocr/core/tesseract-core-lstm.wasm
          test -s _site/ocr/lang/chi_sim.traineddata.gz
          test -s _site/ocr/lang/eng.traineddata.gz

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
