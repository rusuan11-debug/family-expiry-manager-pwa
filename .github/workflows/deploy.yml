name: Deploy Family Expiry Manager PWA

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'core.js'
      - 'storage.js'
      - 'styles.css'
      - 'sw.js'
      - 'barcode.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Assemble complete PWA
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          mkdir _site
          unzip -q "$ZIP_FILE" -d _site
          for file in index.html app.js core.js storage.js styles.css sw.js barcode.js; do
            test -s "$file"
            cp "$file" "_site/$file"
          done
          touch _site/.nojekyll
          test -f _site/manifest.webmanifest
          test -f _site/assets/icon-192.png

      - name: Run JavaScript syntax and logic tests
        working-directory: _site
        run: |
          npm test --if-present
          node --check app.js
          node --check core.js
          node --check storage.js
          node --check sw.js
          node --check barcode.js

      - name: Bundle local barcode scanner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _vendor
          cd _vendor
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts @zxing/browser@0.1.5 @zxing/library@0.21.3 esbuild@0.25.0
          cd ..
          NODE_PATH="$PWD/_vendor/node_modules" _vendor/node_modules/.bin/esbuild barcode.js --bundle --format=esm --platform=browser --target=es2020 --outfile=_site/barcode.bundle.js
          test -s _site/barcode.bundle.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
